name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'FantasyMastersOffline-source-*.zip'
      - '.github/workflows/Build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find . -maxdepth 1 -type f -name 'FantasyMastersOffline-source-*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one FantasyMastersOffline-source-*.zip at repository root; found ${#archives[@]}"
            printf 'Root files:\n'
            find . -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          archive="${archives[0]}"
          mkdir -p .fm-project
          unzip -q "$archive" -d .fm-project
          mapfile -t test_files < <(find .fm-project -type f -path '*/tests/rules.test.cjs' -print)
          if [ "${#test_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tests/rules.test.cjs inside $archive; found ${#test_files[@]}"
            unzip -l "$archive"
            exit 1
          fi
          project_root="$(dirname "$(dirname "${test_files[0]}")")"
          for required in settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml; do
            test -f "$project_root/$required" || { echo "::error::Missing project file: $required"; exit 1; }
          done
          cp -a "$project_root"/. .
          test -f tests/rules.test.cjs
          echo "Extracted project from: $archive"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test game rules
        run: node --test tests/rules.test.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy 'tools' package. Explicitly install only
          # platform-tools to prevent sdkmanager from failing during setup.
          packages: 'platform-tools'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FantasyMastersOffline-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
