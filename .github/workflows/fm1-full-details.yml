name: FM1 Full Card Detail Enrichment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fm1_crawler/requirements.txt
      - name: Download verified 15,350-card listing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base output
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13045472102/zip" \
            -o /tmp/fm1-base.zip
          unzip -q /tmp/fm1-base.zip -d base
          test -s base/FM1_Master_Database.db
          test "$(find base/images -type f | wc -l)" -ge 15000
          cp -a base/images output/
          cp -a base/raw output/
          cp base/FM1_Master_Database.db output/FM1_Master_Database.db
      - name: Install crawler dependencies
        working-directory: fm1_crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Crawl every card detail tab
        env:
          FM1_DB: ../output/FM1_Master_Database.db
        working-directory: fm1_crawler
        run: python crawl_details.py
      - name: Package enriched database
        run: |
          cp -a fm1_crawler/output/large_images output/ || true
          cp fm1_crawler/output/detail_summary.json output/detail_summary.json
          cat output/detail_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: FM1-full-card-database
          path: output/
          if-no-files-found: error
          retention-days: 30
