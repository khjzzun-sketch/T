name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'FantasyMastersOffline-source-v0.1.1.zip'
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Extract Android project from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="FantasyMastersOffline-source-v0.1.1.zip"
          test -f "$ARCHIVE" || { echo "::error::Project ZIP not found at repository root: $ARCHIVE"; find . -maxdepth 3 -type f -print; exit 1; }
          mkdir -p .fm-project
          unzip -q "$ARCHIVE" -d .fm-project
          TEST_FILE="$(find .fm-project -type f -path '*/tests/rules.test.cjs' -print -quit)"
          test -n "$TEST_FILE" || { echo "::error::tests/rules.test.cjs not found inside $ARCHIVE"; unzip -l "$ARCHIVE"; exit 1; }
          ROOT="$(dirname "$(dirname "$TEST_FILE")")"
          cp -a "$ROOT"/. .
          test -f tests/rules.test.cjs
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Project extracted and required files verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test game rules
        run: node --test tests/rules.test.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FantasyMastersOffline-debug-v0.1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
